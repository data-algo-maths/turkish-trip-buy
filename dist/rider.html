<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d1d1b"><title>Turkish Trip Buy Driver</title><link rel="stylesheet" href="role.css"></head><body>
<div class="shell rider-shell"><header class="topbar"><a class="brand" href="index.html"><span class="mark">T</span><span>Turkish Trip Buy</span></a><span class="role-tag">Driver</span><div class="top-actions"><span class="online-pill" id="riderStatus"><i></i><span>Offline</span></span><a class="link-button" href="admin.html">Admin</a></div></header>
<main class="rider-main">
  <section class="card shift-card"><div><span>SELECT RIDER</span><b><select id="riderSelect" aria-label="Choose demo rider"></select></b></div><div><span>AVAILABILITY</span><b id="availabilityText">Offline</b></div><button class="toggle" id="availabilityToggle" aria-label="Toggle availability"></button></section>
  <section class="card map-card" id="mapCard"><div id="riderMap" class="native-map demo-map"></div><div class="gps-label" id="gpsLabel">Location not shared</div></section>
  <section class="location-row"><button class="ghost-button" id="shareLocation">Share live location</button><button class="ghost-button" id="demoLocation">Use demo location</button></section><p class="gps-data" id="gpsData">No coordinates sent</p>
  <section class="card job-card" id="jobCard" hidden><p class="eyebrow">ACTIVE DELIVERY</p><h2 id="jobId"></h2><p class="subtle" id="jobCustomer"></p><div class="job-meta"><span id="jobStatus"></span><span id="jobEta"></span><span id="jobTotal"></span></div><div class="address-block"><small>PICKUP</small><b>Turkish Trip Buy Kitchen</b></div><div class="address-block"><small>DROP-OFF</small><b id="jobAddress"></b></div><div class="step-actions"><button class="primary-button" data-step="accept">Accept delivery</button><button class="ghost-button" data-step="At kitchen">Arrived at kitchen</button><button class="ghost-button" data-step="Picked up">Confirm pickup</button><button class="ghost-button" data-step="Out for delivery">Start delivery</button><button class="ghost-button" data-step="Arrived">Arrived at customer</button><button class="primary-button" data-step="Delivered">Complete delivery</button></div></section>
  <section class="card empty-job" id="emptyJob"><div>🛵</div><h2>No active delivery</h2><p>Go online, then ask the dispatcher to assign an order. New work will appear automatically.</p></section>
</main></div><div class="toast" id="toast"></div><script src="mobile-bridge.js"></script><script src="runtime.js"></script><script src="rider.js"></script></body></html>
